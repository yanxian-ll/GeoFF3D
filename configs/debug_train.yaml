defaults:
  - machine: aws
  - dataset: uavtrain_6d_518_many_ar_16ipg_2g
  - loss: geoff3d_loss
  - model: geoff3d
  - model/task: world_translation_prior
  - train_params: pi3_finetune
  - distributed: default
  - _self_

output_dir: ${hydra:run.dir}
root_data_dir: ${machine.root_data_dir}
mapanything_dataset_metadata_dir: ${machine.mapanything_dataset_metadata_dir}
root_pretrained_checkpoints_dir: ${machine.root_pretrained_checkpoints_dir}
root_experiments_dir: ${machine.root_experiments_dir}
root_uniception_pretrained_checkpoints_dir: ${machine.root_uniception_pretrained_checkpoints_dir}

dataset:
  num_workers: 12
  num_views: 8
  min_num_views: 1
  principal_point_centered: true
  world_frame_augmentation:
    enabled: true

model:
  task:
    overall_prob: 1.0
    ray_dirs_prob: 1.0
    depth_prob: 0.0
    world_translation_prob: 1.0
    world_rotation_prob: 1.0
    dropout_prob: 0
    sparse_depth_prob: 0
  model_config:
    pretrained_model_name_or_path: "./checkpoints/pi3x"

train_params:
  lr: 5e-06
  min_lr: 5e-08
  submodule_configs:
    model.encoder:
      lr: 1e-07
      min_lr: 1e-09
  epochs: 10
  warmup_epochs: 2
  accum_iter: 16
  keep_freq: 4
  max_num_of_imgs_per_gpu: 16
  max_loss_value: 10000

hydra:
  run:
    dir: ${root_experiments_dir}/dom/uav_training/geoff3d_no_metric_scale_8v_6d_16ipg_2g_aug_debug
