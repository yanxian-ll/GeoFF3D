defaults:
  - resolution_options: default
  - world_augmentation: default
  - blendedmvs_wai: default
  - uavscenes_wai: default
  - a3dreal_wai: default
  - a3dsynl_wai: default
  - a3dsyns_wai: default
  - usegeo_wai: default

# Training Set, For example: BlendedMVS(split='train', resolution=(512, 384), transform=...)
train_dataset: ???
# Validation Set
test_dataset: "[null]"
# Number of workers for dataloader
num_workers: 12
# Default resolution for training
resolution_train: ???
# Default resolution for validation
resolution_val: ???
# Number of views parameter for multi-view datasets
num_views: 2
# Minimum number of views when train.variable_num_views=true. The sampled
# view count range is [min_num_views, num_views]. Defaults to the legacy value 2.
min_num_views: 2
# Use a centered principal point for all images
principal_point_centered: false
# Default config for multi-view datasets
train:
  # If True, the number of views can vary from batch to batch. The maximum number of views is num_views and minimum is min_num_views.
  variable_num_views: true
  # Image/color augmentation policy across views in one sample.
  # per_view: each view samples independent ColorJitter/Grayscale/Blur.
  # per_sample: all views in one sample reuse the same augmentation parameters.
  image_transform_mode: "per_view"
val:
  variable_num_views: false
test:
  variable_num_views: false
