# Second-stage Z-up world-translation-prior loss for GeoFF3D.
#
# Stage 1 uses avgdist-normalized supervision for stable convergence. This
# stage switches supervision to absolute metric coordinates by setting
# norm_mode='' on the dataset-world-frame point and pose losses. Absolute metric
# errors are much larger than avgdist-normalized losses, so their weights are
# scaled down and pose translation is warmed up.

train_criterion: |
  0.1 * ExcludeTopNPercentPixelLoss(
    WorldFramePointsRegr3D(
      RobustRegressionLoss(alpha=0.5, scaling_c=0.05),
      norm_mode='',
      loss_in_log=False,
      flatten_across_image_only=True,
      detach_world_frame_points_geometry=False,
      detach_world_frame_points_translation=False,
      world_frame_points_loss_weight=1.0
    ),
    top_n_percent=5,
    apply_to_real_data_only=True,
    loss_set_indices=[0]
  ) + 0.2 * WorldFramePoseLoss(
    FactoredLLoss(
      reduction='mean',
      pose_trans_loss_type='l1',
      pose_quats_loss_type='l1'
    ),
    norm_mode='',
    depth_type_for_loss='depth_z',
    pose_trans_loss_weight=0.1,
    pose_trans_loss_weight_schedule={
      'start_weight': 0.0,
      'end_weight': 0.1,
      'warmup_steps': args.train_params.raw_translation_loss_warmup_steps,
      'start_step': args.train_params.raw_translation_loss_start_step,
      'schedule': args.train_params.raw_translation_loss_schedule
    },
    pose_quats_loss_weight=1.0,
    compute_absolute_pose_loss=True,
    compute_pairwise_relative_pose_loss=False
  ) + GravityAlignmentLoss(
    gravity_loss_weight=1.0,
    loss_type='cosine',
    world_up=(0.0, 0.0, 1.0),
    only_valid_depth=True,
    skip_first_view=False,
    average_across_views=False
  )

test_criterion: |
  0.1 * ExcludeTopNPercentPixelLoss(
    WorldFramePointsRegr3D(
      RobustRegressionLoss(alpha=0.5, scaling_c=0.05),
      norm_mode='',
      loss_in_log=False,
      flatten_across_image_only=True,
      detach_world_frame_points_geometry=True,
      detach_world_frame_points_translation=False,
      world_frame_points_loss_weight=1.0
    ),
    top_n_percent=5,
    apply_to_real_data_only=True,
    loss_set_indices=[0]
  ) + 0.2 * WorldFramePoseLoss(
    FactoredLLoss(
      reduction='mean',
      pose_trans_loss_type='l1',
      pose_quats_loss_type='l1'
    ),
    norm_mode='',
    depth_type_for_loss='depth_z',
    pose_trans_loss_weight=0.1,
    pose_quats_loss_weight=1.0,
    compute_absolute_pose_loss=True,
    compute_pairwise_relative_pose_loss=False
  ) + GravityAlignmentLoss(
    gravity_loss_weight=1.0,
    loss_type='cosine',
    world_up=(0.0, 0.0, 1.0),
    only_valid_depth=True,
    skip_first_view=False,
    average_across_views=False
  )
