defaults:
  - machine: aws
  - model: default
  - dataset: default
  - _self_

output_dir: ${hydra:run.dir}
root_data_dir: ${machine.root_data_dir}
mapanything_dataset_metadata_dir: ${machine.mapanything_dataset_metadata_dir}
root_pretrained_checkpoints_dir: ${machine.root_pretrained_checkpoints_dir}
root_experiments_dir: ${machine.root_experiments_dir}
root_uniception_pretrained_checkpoints_dir: ${machine.root_uniception_pretrained_checkpoints_dir}

### Benchmarking args
seed: 0
# Disable CUDNN Benchmark (Disable for variable resolution & number of view training)
disable_cudnn_benchmark: true
# Batch size for inference (Metrics are computed per multi-view set and averaged, not per batch of multi-view sets)
batch_size: 10
# Use mixed precision for inference
amp: 1
# Floating point type to use for mixed precision
amp_dtype: "bf16"
# compute absolute metrics
compute_abs_metrics: true
# Optional: report trajectory-only Pose ATE after separate pose alignment.
# This is only for protocol comparison; the main abs_pose_ate still uses shared point-cloud alignment.
compute_separate_align_pose_ate: false
# save num fused points per scene
save_n_fused_ply: 5

# Sim(3) rotation/scale statistics script options.
# Kept in the base config so Hydra overrides can use alignment_stats.split=train/test
# without the + prefix.
alignment_stats:
  split: test
  save_per_sample: true

# Device setting for benchmarking.
# Options:
#   device: auto / cpu / cuda / cuda:0 / cuda:1
#   cuda_device: null / 0 / 1 / ...
device: auto
cuda_device: null
