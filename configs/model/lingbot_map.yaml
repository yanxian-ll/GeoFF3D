# String for model factory
model_str: "lingbot-map"
# Model config
model_config:
  name: "lingbot-map"
  # Checkpoint path for LingBot-Map. Can be overridden with --model_path.
  checkpoint: null
  model_path: "checkpoints/lingbot-map/lingbot-map/lingbot-map-long.pt"
  device: "cuda"
  mode: "streaming"
  use_amp: true
  use_sdpa: true
  image_size: 518
  patch_size: 14
  num_scale_frames: 8
  max_frame_num: 1024
  keyframe_interval: "auto"
  max_points: 800000
# Streaming methods do scene-level inference and do not consume normalized
# MapAnything view tensors.
data_norm_type: "identity"
pretrained: null
torch_hub_force_reload: false
defaults:
  - default
