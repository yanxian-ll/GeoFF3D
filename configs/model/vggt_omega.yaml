# String for model factory
model_str: "vggt_omega"

# Model config
model_config:
  name: "vggt_omega"

  # Official VGGT-Omega checkpoints are gated on Hugging Face and must be
  # downloaded manually. This wrapper supports only the official raw state_dict
  # format from facebookresearch/vggt-omega, e.g. vggt_omega_1b_512.pt.
  # You can either set load_pretrained_weights=true with checkpoint_path here,
  load_pretrained_weights: true
  checkpoint_path: "checkpoints/vggt-omega/vggt_omega_1b_512.pt"
  strict_checkpoint: true

  # Backward-compatible aliases accepted by the wrapper.
  pretrained_model_name_or_path: null
  load_custom_ckpt: false
  custom_ckpt_path: null

  # Upstream VGGT-Omega-1B defaults.
  patch_size: 16
  embed_dim: 1024
  enable_camera: true
  enable_depth: true
  # Set true only for the official 256 text-alignment checkpoint.
  enable_alignment: false

  # Activation checkpointing for memory-efficient VGGT-Omega fine-tuning.
  # This is wired through VGGTOmegaWrapper -> VGGTOmega -> Aggregator.
  gradient_checkpointing: true

  # DenseHead supports chunked frame decoding; keep this consistent with VGGTWrapper.
  frames_chunk_size: 8

# Image Normalization Type
# The wrapper expects images in [0, 1] without DINO/VGGT mean-std normalization.
# The VGGT-Omega aggregator applies the official ImageNet normalization internally.
# Input H/W must already be divisible by model_config.patch_size. The wrapper only
# validates this requirement and does not resize, crop, or pad images.
data_norm_type: "identity"

# VGGT-Omega checkpoint is loaded by the wrapper or through --checkpoint.
pretrained: null

# Torch hub force reload is unused by VGGT-Omega.
torch_hub_force_reload: false
