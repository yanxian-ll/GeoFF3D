defaults:
  - default

# Unified prior probabilities for independent GeoFF3D.
# All priors are fused as encoder-token biases before the decoder.
overall_prob: 1.0

# Dense priors.
ray_dirs_prob: 1.0
depth_prob: 1.0
sparse_depth_prob: 1.0
sparsification_removal_percent: 0.9

# World-frame global priors.
world_translation_prob: 1.0
world_rotation_prob: 1.0

# Deprecated compatibility field. It is intentionally ignored by
# GeoFF3D because the original Pi3X relative pose-injection path
# has been removed.
cam_prob: 0.0

# Legacy GeoFF3D conditioning fields kept for compatibility.
dropout_prob: 0
depth_scale_norm_all_prob: 0
pose_scale_norm_all_prob: 0
