defaults:
  - default

# MapAnything relative-translation-only conditioning.
# The model converts camera centers to relative translation vectors from view 0:
#   delta_t_i = t_i - t_0
# These vectors use MapAnything's native cam_trans_encoder and scale encoder.
# No camera rotation, ray/intrinsics, or depth prior is provided.
overall_prob: 1.0
dropout_prob: 0.0

ray_dirs_prob: 0.0
depth_prob: 0.0
cam_rot_prob: 0.0
cam_trans_prob: 1.0

sparse_depth_prob: 0.0
sparsification_removal_percent: 0.0
depth_scale_norm_all_prob: 0.0
pose_scale_norm_all_prob: 0.0
