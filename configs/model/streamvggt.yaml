# String for model factory
model_str: "streamvggt"
# Model config
model_config:
  name: "streamvggt"
  # If null, wrapper falls back to StreamVGGT's local ckpt/checkpoints.pth,
  # then to the HuggingFace file used by the official demo.
  checkpoint: null
  model_path: null
  device: "cuda"
  max_points: 800000
# Streaming methods do scene-level inference and do not consume normalized
# MapAnything view tensors.
data_norm_type: "identity"
pretrained: null
torch_hub_force_reload: false
defaults:
  - default
