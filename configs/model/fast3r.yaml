# String for model factory
model_str: "fast3r"
# Model config
model_config:
  name: "fast3r"
  # Load pre-trained weights
  load_pretrained_weights: true
  # Local Hugging Face checkpoint directory for Fast3R
  pretrained_model_name_or_path: "checkpoints/Fast3R_ViT_Large_512"
  # Fast3R official inference is stable with float32 by default.
  dtype: "float32"
  # PnP pose estimation settings from the official Fast3R demo/example.
  niter_pnp: 100
  focal_length_estimation_method: "first_view_from_global_head"
  # Kept for config compatibility with other external wrappers.
  gradient_checkpointing: false
# Fast3R wrapper expects identity images in [0, 1], then converts to [-1, 1].
data_norm_type: "identity"
# Fast3R checkpoint is loaded by the wrapper.
pretrained: null
# Torch hub force reload is unused by Fast3R.
torch_hub_force_reload: false
