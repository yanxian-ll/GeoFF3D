# UAV-SLAM benchmark scene list.
#
# Structure:
#   datasets:
#     - name: dataset_name
#       enabled: true/false
#       root: /path/to/dataset/root
#       params:             # dataset-level overrides
#       scenes:
#         - scene_folder_name
#         - name: custom_output_name
#           path: scene_folder_name_or_absolute_path
#           params:         # scene-level overrides
#
# Method/runtime defaults live next to each benchmark family. For ours spatial
# methods, see stream/run.py. This file stays focused on scene/dataset
# selection and scene-specific overrides such as dataset stride.
#
# Parameter names are case-insensitive and '-' is treated as '_'.
# For example, max_chunk_size, MAX_CHUNK_SIZE, and max-chunk-size all map to
# the _run_spatial_method.sh variable MAX_CHUNK_SIZE.
# Checkpoint and Python paths can be changed here. Environment variables remain
# available as temporary overrides.

methods:
  lingbot-map:
    python: python3
    checkpoint: ""
  stream3r:
    python: /opt/conda/envs/stream3r/bin/python
    checkpoint: yslan/STream3R
  streamvggt:
    python: /opt/conda/envs/streamvggt/bin/python
    checkpoint: ""
  ttt3r:
    python: /opt/conda/envs/ttt3r/bin/python
    checkpoint: checkpoints/ttt3r/cut3r_512_dpt_4_64.pth

datasets:
  - name: npu_dronemap
    enabled: true
    root: /opt/data/private/dataset/data/NPU_Dronemap
    params:
      input:
        stride: 1
    scenes:
      - gopro-monticules-kfs
      - gopro-npu-kfs
      - gopro-saplings-kfs
      - phantom3-factory-kfs
      - phantom3-freeway-kfs
      - phantom3-grass-kfs
      - phantom3-highflower-kfs
      - phantom3-huangqi-kfs
      - phantom3-ieu-kfs
      - phantom3-lowlower-kfs
      - phantom3-npu-kfs
      - phantom3-village-kfs

  - name: uavscenes
    enabled: true
    root: /opt/data/private/dataset/data/uavscenes
    params:
      input:
        stride: 3
    scenes:
      - interval5_AMtown01
      - interval5_AMtown02
      - interval5_AMvalley01
      - interval5_AMvalley02
      - interval5_HKairport01
      - interval5_HKairport02
      - interval5_HKisland01
      - interval5_HKisland02
