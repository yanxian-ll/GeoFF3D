# Dedicated scenes for large-scale framework ablations.
methods:
  geoff3d:
    checkpoints:
      stage2: checkpoints/geoff3d/checkpoint-best.pth
      stage1: checkpoints/geoff3d/checkpoint-stage1.pth

datasets:
  - name: uavscenes
    enabled: true
    root: /opt/data/private/dataset/data/uavscenes
    params:
      input:
        stride: 3
    scenes:
      - interval5_AMtown01

  - name: usegeo
    enabled: true
    root: /opt/data/private/dataset/data/usegeo
    scenes:
      - dataset1
  
  - name: uavff3d_real
    enabled: true
    root: /opt/data/private/dataset/data/UAVFF3D-Real
    scenes:
      - nanfang_ndir2
