# UAV-SLAM benchmark scene list.
#
# Structure:
#   datasets:
#     - name: dataset_name
#       enabled: true/false
#       root: /path/to/dataset/root
#       params:             # dataset-level overrides
#       scenes:
#         - scene_folder_name
#         - name: custom_output_name
#           path: scene_folder_name_or_absolute_path
#           params:         # scene-level overrides
#
# Method/runtime defaults live in the method launchers and configs/slrf.yaml.
# This file stays focused on scene selection and dataset/scene-specific Hydra
# overrides such as input stride.
#
# Nested params blocks are flattened before their leaf values are forwarded to
# scripts/run_slrf.py as Hydra overrides.

methods:
  geoff3d:
    checkpoint: checkpoints/geoff3d/checkpoint-best.pth
  pi3x:
    checkpoint: experiments/uav_training/pi3x_finetuning_8v_4d_8ipg_2g/checkpoint-best.pth
  vggt:
    checkpoint: experiments/uav_training/vggt_finetuning_8v_4d_8ipg_2g/checkpoint-best.pth
  vggt_omega:
    checkpoint: experiments/uav_training/vggt_omega_8v_4d_8ipg_2g/checkpoint-best.pth

datasets:
  - name: uavff3d_real
    enabled: true
    root: /opt/data/private/dataset/data/UAVFF3D-Real
    scenes:
      - nanfang_ndir2
      - yanghaitang_ndir2
      - xiaoxiang_ndir2
