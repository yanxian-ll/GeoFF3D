# UAV-SLAM benchmark scene list.
#
# Structure:
#   datasets:
#     - name: dataset_name
#       enabled: true/false
#       root: /path/to/dataset/root
#       params:             # dataset-level overrides
#       scenes:
#         - scene_folder_name
#         - name: custom_output_name
#           path: scene_folder_name_or_absolute_path
#           params:         # scene-level overrides
#
# Method/runtime defaults live next to each benchmark family. For ours spatial
# methods, see ours/default_params.yaml. This file should stay focused on
# scene/dataset selection and scene-specific overrides such as dataset stride.
#
# Parameter names are case-insensitive and '-' is treated as '_'.
# For example, max_chunk_size, MAX_CHUNK_SIZE, and max-chunk-size all map to
# the _run_spatial_method.sh variable MAX_CHUNK_SIZE.
# Nested blocks below are only for readability; leaf keys are the real names.

datasets:
  - name: uavscenes
    enabled: true
    root: /opt/data/private/dataset/data/uavscenes
    params:
      input:
        stride: 10
    scenes:
      - interval5_AMtown01
      - interval5_AMvalley01
      - interval5_HKairport_GNSS_Evening
      - interval5_HKairport01
      - interval5_HKisland_GNSS_Evening
      - interval5_HKisland01

  - name: usegeo
    enabled: true
    root: /opt/data/private/dataset/data/usegeo
    params:
      input:
        stride: 2
    scenes:
      - dataset1
      - dataset2
      - dataset3

  - name: uavff3d_real
    enabled: true
    root: /opt/data/private/dataset/data/UAVFF3D-Real
    params:
      input:
        stride: 5
    scenes:
      - nanfang_ndir2
      - yanghaitang_ndir2
      - xiaoxiang_ndir2
      - nanfang_part0_ndir
      - xiaoxiang_part3_ndir
      - yanghaitang_part0_ndir

  - name: npu_dronemap
    enabled: true
    root: /opt/data/private/dataset/data/NPU_Dronemap
    params:
      input:
        stride: 4
    scenes:
      - gopro-monticules-kfs
      - gopro-npu-kfs
      - gopro-saplings-kfs
      - phantom3-factory-kfs
      - phantom3-freeway-kfs
      - phantom3-grass-kfs
      - phantom3-highflower-kfs
      - phantom3-huangqi-kfs
      - phantom3-ieu-kfs
      - phantom3-lowlower-kfs
      - phantom3-npu-kfs
      - phantom3-village-kfs

  - name: urbanscene3d
    enabled: true
    root: /opt/data/private/dataset/data/urbanscene3d
    params:
      input:
        stride: 4
    scenes:
      - artsci_ndir
      - polytech_ndir
