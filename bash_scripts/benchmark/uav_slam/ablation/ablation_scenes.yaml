        stride: 3
    scenes:
      - interval5_AMtown01

  - name: usegeo
    enabled: true
    root: /opt/data/private/dataset/data/usegeo
    scenes:
      - dataset1
  
  - name: uavff3d_real
    enabled: true
    root: /opt/data/private/dataset/data/UAVFF3D-Real
    scenes:
      - nanfang_ndir2
