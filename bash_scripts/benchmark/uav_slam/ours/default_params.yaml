# Default parameters for ours spatial UAV-SLAM benchmark methods.
#
# Scene/dataset definitions live in ../default_scenes.yaml. Keep method/runtime
# defaults here so other benchmark families can use the same scene list without
# inheriting ours-specific settings.

params:
  runtime:
    cuda_device: 0
    output_group_by_dataset: 1
    overwrite: 0
    dry_run: 0

  model:
    checkpoint:
    model_family: auto
    align: auto
    recenter: auto

  input:
    max_side: 518
    num_views: 0
    stride: 1
    scene_io_workers: 4
    footprint_workers: 4

  chunking:
    max_chunk_size: 50
    min_chunk_size: 8
    chunk_order: spatial_center_bfs
    chunk_cache_workers: 2
    chunk_cache_max_pending: 4
    chunk_footprint_font_scale: 1.35
    chunk_footprint_label_size: 11.0
    chunk_footprint_padding_ratio: 0.02
    chunk_footprint_show_legend: 0

  output:
    max_points_per_view: 500000
    voxel_downsample: 0.01
    point_downsample: 1

  filtering:
    depth_conf_filter: 1
    conf_quantile: 0.25
    debug_depth_conf_filter: 0

  fusion:
    xy_fill_unmasked: 1
    xy_fill_grid_size: 0.01
    xy_fill_max_points_per_chunk: 125000

  priors:
    pose_prior: auto
    translation_prior: auto
    rotation_prior: auto
    ray_prior: auto
    depth_prior: auto

  pose_perturb:
    pose_perturb: 0
    pose_perturb_xy_std: 0.0
    pose_perturb_z_std: 0.0
    pose_perturb_yaw_std_deg: 0.0
    pose_perturb_xy_max: 0.0
    pose_perturb_z_max: 0.0
    pose_perturb_yaw_max_deg: 0.0
    pose_perturb_seed_offset: 930001

  multiview_filter:
    mv_consistency: 0
    mv_min_support: 1
    mv_conf_threshold: 0.0

  post_align:
    post_chunk_align: 1
    post_chunk_align_mode: rigid
    post_chunk_align_min_corr: 512
    post_chunk_align_max_corr_per_view: 4096
    post_chunk_align_max_corr: 50000
    post_chunk_align_no_spatial_balance: 0
    post_chunk_align_spatial_grid_size: 16
    post_chunk_align_spatial_min_corr_per_cell: 64
    post_chunk_align_spatial_max_corr_per_cell: 0
    post_chunk_align_workers: 2
    post_chunk_align_nn_fallback: 0
    post_chunk_align_nn_points: 20000
    post_chunk_align_nn_quantile: 0.7

  dom:
    render_dom: 0
    dom_gsd: 0
    dom_source: core
    dom_tile_px: 1024
    dom_margin_px: 128
    dom_splat_scale: 1.5
    dom_dsm_smooth_radius_px: 3
    dom_dsm_smooth_sigma: 0.0
    dom_dsm_smooth_iterations: 1
    dom_dsm_smooth_min_weight: 0.05
    dom_save_contours: 1
    dom_max_pixels: 160000000
    dom_allow_large: 0
    dom_save_tiles: 1
    dom_epsg: 0
    dom_axes: xy
    dom_up_axis: z
    dom_max_gaussians_per_tile: 0
    dom_opacity: 0.95
    dom_gsd_stride: 8
    dom_bounds_qmin: 0.5
    dom_bounds_qmax: 99.5
    dom_padding_m: 0

  gsplat:
    gsplat_refine: 0
    gsplat_steps: 30000
    gsplat_max_gaussians: 5000000
    gsplat_batch_views: 2
    gsplat_render_scale: 1.0
    gsplat_single_max_images: 300
    gsplat_max_images_per_bundle: 250
    gsplat_min_core_images_per_bundle: 200
    gsplat_optimize_pose: 0
    gsplat_save_rendered_views: 1
    gsplat_render_output_max_views: 12
    gsplat_render_output_stride: 1
    gsplat_strategy: default
    gsplat_sh_degree: 3
    gsplat_sh_degree_interval: 1000
    gsplat_init_opacity: 0.1
    gsplat_init_scale: 1.0
    gsplat_ssim_lambda: 0.2
    gsplat_means_lr: 1.6e-4
    gsplat_scales_lr: 5e-3
    gsplat_opacities_lr: 5e-2
    gsplat_quats_lr: 1e-3
    gsplat_sh0_lr: 2.5e-3
    gsplat_shN_lr: 1.25e-4
    gsplat_pose_lr: 1e-5
    gsplat_pose_reg: 1e-6
    gsplat_opacity_reg: 0.0
    gsplat_scale_reg: 0.0
    gsplat_refine_start_iter: 500
    gsplat_refine_stop_iter: 15000
    gsplat_refine_every: 100
    gsplat_reset_every: 3000
    gsplat_prune_opa: 0.005
    gsplat_grow_grad2d: 0.0002
    gsplat_grow_scale3d: 0.01
    gsplat_grow_scale2d: 0.05
    gsplat_prune_scale3d: 0.1
    gsplat_prune_scale2d: 0.15
    gsplat_absgrad: 0
    gsplat_strategy_quiet: 1
    gsplat_packed: 0
    gsplat_sparse_grad: 0
    gsplat_visible_adam: 0
    gsplat_antialiased: 0
    gsplat_random_bkgd: 0

  logging:
    log_chunks: 0

  metrics:
    run_metrics: 1
    metric_thresholds: 0.5,1.0,2.0,5.0
    metric_rpe_steps: 1,5,10
    metric_max_gt_points: 300000
    metric_max_pred_points_eval: 300000
    metric_max_gt_points_eval: 300000
    metric_max_align_points: 100000
    metric_icp_iterations: 8
    metric_icp_trim_quantile: 0.7
    metric_gt_io_workers: 4
