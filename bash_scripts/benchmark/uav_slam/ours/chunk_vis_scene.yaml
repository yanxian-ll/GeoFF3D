# UAV-SLAM benchmark scene list.
#
# Structure:
#   datasets:
#     - name: dataset_name
#       enabled: true/false
#       root: /path/to/dataset/root
#       params:             # dataset-level overrides
#       scenes:
#         - scene_folder_name
#         - name: custom_output_name
#           path: scene_folder_name_or_absolute_path
#           params:         # scene-level overrides
#
# Method/runtime defaults live next to each benchmark family. For ours spatial
# methods, see ours/default_params.yaml. This file should stay focused on
# scene/dataset selection and scene-specific overrides such as dataset stride.
#
# Parameter names are case-insensitive and '-' is treated as '_'.
# For example, max_chunk_size, MAX_CHUNK_SIZE, and max-chunk-size all map to
# the _run_spatial_method.sh variable MAX_CHUNK_SIZE.
# Nested blocks below are only for readability; leaf keys are the real names.

datasets:

  - name: uavscenes
    enabled: true
    root: /opt/data/private/dataset/data/uavscenes
    params:
      input:
        stride: 3
      visualization:
        chunk_footprint_font_scale: 1.6
        chunk_footprint_label_size: 12.0
        chunk_footprint_padding_ratio: 0.1
        chunk_footprint_show_legend: 0
    scenes:
      - interval5_AMtown01
